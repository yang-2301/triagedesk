<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="700" fill="#1f2328">triagedesk — full-stack support desk with automatic triage</text>
  <text x="40" y="64" font-size="13" fill="#57606a">FastAPI + SQLAlchemy + Vue 3 · JWT with refresh rotation · RBAC · ticket state machine · SLA clock</text>

  <!-- client -->
  <rect x="40" y="96" width="160" height="72" rx="9" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="120" y="124" font-size="13" text-anchor="middle" fill="#0969da" font-weight="600">Vue 3 + TS  :5173</text>
  <text x="120" y="144" font-size="11" text-anchor="middle" fill="#57606a">Pinia · Chart.js</text>

  <!-- api -->
  <rect x="250" y="96" width="220" height="72" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="360" y="124" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="600">FastAPI  :8123</text>
  <text x="360" y="144" font-size="11" text-anchor="middle" fill="#57606a">JWT auth · RBAC · pagination</text>

  <line x1="202" y1="132" x2="246" y2="132" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- services -->
  <rect x="520" y="88" width="200" height="88" rx="9" fill="#fbefff" stroke="#c297ff"/>
  <text x="620" y="114" font-size="12.5" text-anchor="middle" fill="#8250df" font-weight="600">Ticket state machine</text>
  <text x="620" y="134" font-size="11" text-anchor="middle" fill="#57606a">open → in_progress →</text>
  <text x="620" y="150" font-size="11" text-anchor="middle" fill="#57606a">resolved → closed</text>
  <text x="620" y="168" font-size="10.5" text-anchor="middle" fill="#9a6700">illegal transitions rejected</text>

  <rect x="750" y="88" width="190" height="88" rx="9" fill="#fff8e5" stroke="#d4a72c"/>
  <text x="845" y="114" font-size="12.5" text-anchor="middle" fill="#7d4e00" font-weight="600">SLA clock</text>
  <text x="845" y="134" font-size="11" text-anchor="middle" fill="#57606a">per-priority due time</text>
  <text x="845" y="150" font-size="11" text-anchor="middle" fill="#57606a">breach flags on list view</text>

  <line x1="472" y1="132" x2="516" y2="132" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- classifier -->
  <rect x="250" y="206" width="220" height="104" rx="9" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="360" y="232" font-size="12.5" text-anchor="middle" fill="#1a7f37" font-weight="600">Naive Bayes triage</text>
  <text x="360" y="252" font-size="11" text-anchor="middle" fill="#57606a">pure Python, bigram features</text>
  <text x="360" y="270" font-size="11" text-anchor="middle" fill="#57606a">token-normalised confidence</text>
  <text x="360" y="292" font-size="11" text-anchor="middle" fill="#1a7f37" font-weight="700">86.7% accuracy · 26/30</text>

  <rect x="520" y="206" width="420" height="104" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="540" y="232" font-size="12.5" fill="#1f2328" font-weight="600">What triage decides on creation</text>
  <text x="540" y="254" font-size="11.5" fill="#57606a">category (billing · bug · account · feature) and priority</text>
  <text x="540" y="274" font-size="11.5" fill="#57606a">confidence below threshold → flagged for human review</text>
  <text x="540" y="294" font-size="11.5" fill="#57606a">assignment queue chosen by category</text>

  <line x1="472" y1="132" x2="472" y2="258" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="472" y1="258" x2="516" y2="258" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="360" y1="172" x2="360" y2="202" stroke="#4ac26b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- data -->
  <rect x="40" y="352" width="300" height="96" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="376" font-size="12.5" fill="#1f2328" font-weight="600">Database</text>
  <text x="60" y="398" font-size="11.5" fill="#57606a">SQLAlchemy models · SQLite locally,</text>
  <text x="60" y="416" font-size="11.5" fill="#57606a">Postgres via docker-compose</text>
  <text x="60" y="434" font-size="11.5" fill="#57606a">users · tickets · comments · events</text>

  <rect x="370" y="352" width="300" height="96" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="390" y="376" font-size="12.5" fill="#1f2328" font-weight="600">Auth &amp; roles</text>
  <text x="390" y="398" font-size="11.5" fill="#57606a">PBKDF2 password hashing</text>
  <text x="390" y="416" font-size="11.5" fill="#57606a">access + refresh rotation</text>
  <text x="390" y="434" font-size="11.5" fill="#57606a">agent · requester · admin scopes</text>

  <rect x="700" y="352" width="240" height="96" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="720" y="376" font-size="12.5" fill="#1f2328" font-weight="600">Tests &amp; demo</text>
  <text x="720" y="398" font-size="11.5" fill="#57606a">16 pytest cases (auth, RBAC,</text>
  <text x="720" y="416" font-size="11.5" fill="#57606a">state machine, SLA, triage)</text>
  <text x="720" y="434" font-size="11.5" fill="#57606a">seeded demo data · make dev</text>

  <line x1="360" y1="314" x2="360" y2="348" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- flow strip -->
  <rect x="40" y="476" width="900" height="52" rx="9" fill="#fbfcfd" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="60" y="507" font-size="12" fill="#57606a">create ticket → classify (category + priority) → assign → work → resolve (SLA stops) → close · every transition written to an event log</text>

  <text x="40" y="550" font-size="11" fill="#8b949e">One repo, both halves: Vue SPA and FastAPI service ship together, `make dev` runs both</text>
</svg>
