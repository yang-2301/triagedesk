services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8123:8123"
    environment:
      - TRIAGEDESK_SECRET=change-me-in-production
      # - OPENAI_API_KEY=sk-...   # optional: upgrades triage from local NB to LLM
    volumes:
      - api-data:/app/data

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python3 scripts/seed.py
    environment:
      - TRIAGEDESK_DB=sqlite:////app/data/triagedesk.db
    depends_on:
      - api

  web:
    build:
      context: ./frontend
      args:
        API_TARGET: http://api:8123
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  api-data:
